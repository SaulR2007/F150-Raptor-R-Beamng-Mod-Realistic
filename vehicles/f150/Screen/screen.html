<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="/ui/lib/ext/hu.js"></script>
<style>
    body {
        margin: 0;
        padding: 0;
        width: 480px;
        height: 800px;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: rgb(0, 0, 0);
        color: white;
    }
    
    /* Top status bar */
    .status-bar {
        height: 36px;
        background: #111;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 15px;
        border-bottom: 1px solid #333;
        box-sizing: border-box;
        width: 100%;
    }
    
    .time {
        font-size: 16px;
    }
    
    .temperature {
        font-size: 16px;
    }
    
    /* Presets row */
    .presets-container {
        width: 100%;
        overflow: hidden;
        background: #111;
        border-bottom: 1px solid #333;
        box-sizing: border-box;
    }

    .presets {
        display: flex;
        padding: 10px;
        gap: 8px;
        width: 100%;
        box-sizing: border-box;
    }
    
    .preset {
        flex: 0 0 auto;
        width: calc((100% - 40px) / 6);
        height: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #222;
        border-radius: 5px;
        position: relative;
    }
    
    .preset.selected {
        background: #333;
        border: 1px solid #f00;
    }
    
    .preset-number {
        position: absolute;
        top: 2px;
        left: 5px;
        font-size: 10px;
        color: #999;
    }
    
    .preset-name {
        font-size: 12px;
        margin-top: 5px;
    }

    /* Music content area */
    .main-content {
        height: calc(100% - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        box-sizing: border-box;
    }
    
    #music-frame {
        width: 100%;
        height: 100%;
        border: none;
        overflow: hidden;
    }
    
    /* Bottom navigation */
   .nav-bar {
    height: 60px;  /* Reduced height since we don't have labels */
    background: #111;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #333;
    position: absolute;
    bottom: 0;
    width: 100%;
    box-sizing: border-box;
}

.nav-item {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
    transition: opacity 0.2s;
}

.nav-item.selected {
    opacity: 1;
}

.nav-icon {
    width: 36px;  /* Made icons slightly larger */
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

    .nav-icon svg {
        width: 100%;
        height: 100%;
    }

    .nav-label {
        font-size: 12px;
        color: white;
    }

    .nav-item.selected .nav-icon {
        color: #ff3333;
    }

    .nav-item.selected .nav-label {
        color: #ff3333;
    }

    /* Volume popup styles */
    #volume-popup {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.85);
        padding: 20px 40px;
        border-radius: 10px;
        text-align: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
        border: 1px solid rgba(255, 51, 51, 0.3);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .volume-label {
        font-size: 20px;
        margin-bottom: 10px;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #volume-percentage {
        font-size: 32px;
        font-weight: 500;
        color: #ff3333;
    }
</style>
</head>
<body>
    <!-- Top status bar -->
    <div class="status-bar">
        <div class="temperature">68°</div>
        <div class="time">8:29</div>
    </div>

    <!-- Preset stations -->
    <div class="presets-container">
        <div class="presets">
            <div class="preset selected">
                <div class="preset-number">1</div>
                <div class="preset-name">Classic</div>
            </div>
            <div class="preset">
                <div class="preset-number">2</div>
                <div class="preset-name">The Rocks</div>
            </div>
            <div class="preset">
                <div class="preset-number">3</div>
                <div class="preset-name">SiriusXM</div>
            </div>
            <div class="preset">
                <div class="preset-number">4</div>
                <div class="preset-name">Today</div>
            </div>
            <div class="preset">
                <div class="preset-number">5</div>
                <div class="preset-name">Bad Boys</div>
            </div>
            <div class="preset">
                <div class="preset-number">6</div>
                <div class="preset-name">Highway</div>
            </div>
        </div>
    </div>

    <!-- Main content - music player -->
    <div class="main-content">
        <iframe id="music-frame" src="local://local/vehicles/f150/Screen/music.html"></iframe>
    </div>

    <!-- Bottom nav bar with new icons -->
   <div class="nav-bar">
    <div class="nav-item">
        <div class="nav-icon">
            <img src="local://local/vehicles/f150/Screen/m4icons_apps.png" alt="Apps">
        </div>
    </div>
    <div class="nav-item">
        <div class="nav-icon">
            <img src="local://local/vehicles/f150/Screen/m4icons_car.png" alt="Car">
        </div>
    </div>
    <div class="nav-item">
        <div class="nav-icon">
            <img src="local://local/vehicles/f150/Screen/m4icons_com.png" alt="CTN">
        </div>
    </div>
    <div class="nav-item selected">
        <div class="nav-icon">
            <img src="local://local/vehicles/f150/Screen/m4icons_music.png" alt="Music">
        </div>
    </div>
    <div class="nav-item">
        <div class="nav-icon">
            <img src="local://local/vehicles/f150/Screen/m4icons_nav.png" alt="Navi">
        </div>
    </div>
</div>

    <!-- Volume popup -->
    <div id="volume-popup">
        <div class="volume-label">Volume</div>
        <div id="volume-percentage">50%</div>
    </div>

    <script>
        // Handle messages from controller to music player
        window.addEventListener('message', function(event) {
            if (event.data.type === 'volumeChange') {
                // Show the volume popup
                const volumePopup = document.getElementById('volume-popup');
                const volumePercentage = document.getElementById('volume-percentage');
                
                // Make sure we have a valid number and convert to integer
                const volumeValue = Math.round(parseFloat(event.data.volume) || 0);
                
                // Update volume text
                volumePercentage.textContent = volumeValue + '%';
                
                // Show popup
                volumePopup.style.display = 'block';
                volumePopup.style.opacity = '1';
                
                // Clear existing timeout if there is one
                if (window.volumeTimeout) {
                    clearTimeout(window.volumeTimeout);
                }
                
                // Set new timeout to hide popup
                window.volumeTimeout = setTimeout(() => {
                    volumePopup.style.opacity = '0';
                    setTimeout(() => {
                        volumePopup.style.display = 'none';
                    }, 300);
                }, 1500);
            } else {
                // Forward other messages to music frame
                const musicFrame = document.getElementById('music-frame');
                if (musicFrame && musicFrame.contentWindow) {
                    musicFrame.contentWindow.postMessage(event.data, '*');
                }
            }
        });
        
        // Update time
        function updateTime() {
            const now = new Date();
            const hours = now.getHours() % 12 || 12;
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeElement = document.querySelector('.time');
            if (timeElement) {
                timeElement.textContent = hours + ':' + minutes;
            }
        }
        
        updateTime();
        setInterval(updateTime, 60000);
        
        function updateSelection() {
            try {
                const presets = document.querySelectorAll('.preset');
                const navItems = document.querySelectorAll('.nav-item');
                
                if (typeof currentIndex !== 'undefined') {
                    if (currentIndex === 0) {
                        presets.forEach((preset, i) => {
                            preset.classList.toggle('selected', i === 0);
                        });
                    } else if (currentIndex >= 1 && currentIndex <= 5) {
                        navItems.forEach((item, i) => {
                            item.classList.toggle('selected', i === currentIndex - 1);
                        });
                    }
                }
            } catch (e) {
                console.error("Error in updateSelection:", e);
            }
        }
    </script>
</body>
</html>
